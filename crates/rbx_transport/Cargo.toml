[package]
name = "rbx_transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The RakNet session crypto ported from Boblox's session_crypto.cpp: X25519
# for the two key exchanges, BLAKE2b-512 as the KDF, ChaCha20-Poly1305 for
# the handshake packets and AES-256-GCM for the post-handshake datagrams.
# All pure Rust, so the Android target needs no OpenSSL.
x25519-dalek = { version = "2", features = ["static_secrets"] }
blake2 = "0.10"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
rand_core = { version = "0.64", features = ["getrandom"] }
