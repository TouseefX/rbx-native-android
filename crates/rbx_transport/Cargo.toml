[package]
name = "rbx_transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The RakNet session crypto ported from Boblox's session_crypto.cpp: X25519
# for the two key exchanges, BLAKE2b-512 as the KDF, ChaCha20-Poly1305 for
# the handshake packets and AES-256-GCM for the post-handshake datagrams.
# All pure Rust, so the Android target needs no OpenSSL.
x25519-dalek = { version = "2", features = ["static_secrets"] }
blake2 = "0.10"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# The join-message envelope's AES-128 single blocks — the same `aes` crate
# aes-gcm already builds on, so this adds no new code to the build.
aes = "0.8"
# The 0x90/0x8a bodies carry JSON whose key order must match the native's
# serialiser. `preserve_order` is already unified into the workspace's
# serde_json through the vendored gpui, so this only makes that visible
# where it is relied on.
serde_json = { version = "1", features = ["preserve_order"] }
# The join-game HTTP layer (see `join_game`): the POST that trades a
# .ROBLOSECURITY cookie for a join script. The same version and features
# rbx_cloud already locks for the workspace, so this adds no new code to
# any build.
ureq = { version = "3", features = ["json", "gzip"] }
