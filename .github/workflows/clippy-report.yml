name: Clippy report

# Temporary companion to ci.yml: the desktop jobs fail their clippy step, the
# Actions log hosts are unreachable from the agent working on this branch, and
# the fork has issues disabled. So this runs the same commands and pushes the
# output to ci-reports/ on the branch, where the API and git can read it.
# Delete once the failures it names are fixed.

on:
  push:
    branches: [arena/a3cda33e-rbx-native-android]

permissions:
  contents: write

jobs:
  clippy:
    name: Clippy (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy and cargo test
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/report.log 2>&1
          clippy_status=$?
          if [ "$clippy_status" -eq 0 ]; then
            echo '## cargo test' >> /tmp/report.log
            cargo test --workspace >> /tmp/report.log 2>&1
            test_status=$?
          else
            test_status=0
          fi
          cat /tmp/report.log
          {
            echo '```'
            grep -B 2 -A 12 '^error' /tmp/report.log | head -300
            echo '```'
          } > "$GITHUB_STEP_SUMMARY"
          if [ "$clippy_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            echo "clippy=$clippy_status test=$test_status" >> /tmp/report.log
            exit 1
          fi
      - name: Push the report to the branch
        if: always()
        run: |
          git config user.name "clippy-report bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p ci-reports
          cp /tmp/report.log "ci-reports/report.log"
          git add ci-reports
          git commit -m "clippy/test report for ${{ github.sha }} [skip ci]" \
            || exit 0
          git pull --rebase origin arena/a3cda33e-rbx-native-android
          git push origin HEAD:arena/a3cda33e-rbx-native-android
